services:
  db:
    image: postgres:16-alpine
    container_name: karnataka_news_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: news
      POSTGRES_PASSWORD: news
      POSTGRES_DB: karnataka_news
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news -d karnataka_news"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
